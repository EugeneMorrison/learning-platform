# Lets one header value switch between normal HTTP and WebSocket upgrades
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: plain HTTP. Its only job is to send visitors to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name uchebus.ru www.uchebus.ru;
    return 301 https://$host$request_uri;
}

# Port 443: HTTPS. Decrypts traffic and hands it to Django.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name uchebus.ru www.uchebus.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/uchebus.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # nginx rejects request bodies over 1 MB by default,
    # which would break lesson image uploads.
    client_max_body_size 10m;

    location / {
        proxy_pass http://web:8000;           # the Django container
        proxy_http_version 1.1;               # needed for WebSockets

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for the chat
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;             # keep quiet chat connections open
    }
}