services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"        # host:container — fallback while HTTPS is new; close later
    # Settings come from .env (optional; see .env.example). Without it Django
    # defaults to DEBUG=False and the built-in ALLOWED_HOSTS.
    env_file:
      - path: .env
        required: false     # needs Docker Compose 2.24+
    environment:
      - ALLOWED_HOSTS=185.186.140.57,uchebus.ru,www.uchebus.ru
    volumes:
      - db-data:/app/db          # persist SQLite database between restarts
      - media-data:/app/media    # persist author-uploaded lesson images

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/uchebus.conf:/etc/nginx/conf.d/default.conf:ro
      - /root/certs/uchebus:/etc/nginx/certs:ro   # certificate + key: server only, never in Git
    depends_on:
      - web

volumes:
  db-data:
  media-data: